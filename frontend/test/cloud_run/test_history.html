<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History Module Test</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 1em; background-color: #f8f9fa; }
        .container { max-width: 800px; margin: auto; }
        fieldset { margin-bottom: 1.5em; border: 1px solid #dee2e6; padding: 1.5em; border-radius: 6px; background-color: #fff; }
        legend { font-weight: 600; font-size: 1.2em; padding: 0 0.5em; color: #007bff; }
        input[type="text"], input[type="password"], input[type="number"], textarea { width: calc(100% - 16px); margin-bottom: 10px; padding: 8px; border: 1px solid #ced4da; border-radius: 4px; }
        button { font-size: 1em; padding: 10px 18px; cursor: pointer; border-radius: 5px; border: none; background-color: #007bff; color: white; transition: background-color 0.2s; }
        button:hover { background-color: #0056b3; }
        #results { background-color: #282c34; color: #abb2bf; border-radius: 5px; padding: 1em; white-space: pre-wrap; word-wrap: break-word; margin-top: 1em; font-family: "Fira Code", "Courier New", monospace; }
        #status { font-weight: bold; text-align: center; padding: 0.5em; margin-bottom: 1em; border-radius: 4px; }
        .status-logged-out { background-color: #ffebee; color: #c62828; }
        .status-logged-in { background-color: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Predictions History Test</h1>
        <div id="status" class="status-logged-out">Status: Not Logged In</div>

        <fieldset>
            <legend>1. Login</legend>
            <input type="text" id="login_username" placeholder="Username (e.g., peterpan)">
            <input type="password" id="login_password" placeholder="Password (e.g., PeterPan1234!)">
            <button onclick="loginUser()">Login</button>
        </fieldset>

        <fieldset>
            <legend>2. Log a New Prediction (POST /history)</legend>
            <textarea id="log_text" placeholder="Text that was analyzed..."></textarea>
            <textarea id="log_human_exp" placeholder="Human's explanation..."></textarea>
            <textarea id="log_ai_exp" placeholder="AI's explanation..."></textarea>
            <div>
                <label>Human Prediction:</label>
                <input type="radio" name="log_human_pred" value="true" checked> True
                <input type="radio" name="log_human_pred" value="false"> False
            </div>
            <div>
                <label>AI Prediction:</label>
                <input type="radio" name="log_ai_pred" value="true" checked> True
                <input type="radio" name="log_ai_pred" value="false"> False
            </div>
            <input type="number" id="log_prob" placeholder="AI Probability (e.g., 0.95)" min="0" max="1" step="0.01">
            <button onclick="logPrediction()">Log Prediction</button>
        </fieldset>
        
        <fieldset>
            <legend>3. Retrieve History (GET /history)</legend>
            <input type="number" id="get_limit" placeholder="Limit (e.g., 10)">
            <button onclick="getHistory()">Get My History</button>
        </fieldset>

        <h3>API Response</h3>
        <pre id="results">Awaiting action...</pre>
    </div>

    <script>
        const API_BASE_URL = 'https://hate-backend-215652629527.europe-west2.run.app'; // Updated URL
        let accessToken = null;

        function displayResults(data) {
            document.getElementById('results').textContent = JSON.stringify(data, null, 2);
        }

        // --- Authentication ---
        async function loginUser() {
            const username = document.getElementById('login_username').value;
            const password = document.getElementById('login_password').value;
            const formData = new URLSearchParams({ username, password });

            try {
                const response = await fetch(`${API_BASE_URL}/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail);

                accessToken = data.access_token;
                document.getElementById('status').textContent = `Status: Logged in as '${username}'`;
                document.getElementById('status').className = 'status-logged-in';
            } catch (error) {
                document.getElementById('status').textContent = 'Status: Login Failed';
                document.getElementById('status').className = 'status-logged-out';
                accessToken = null;
                displayResults({ error: error.toString() });
            }
        }

        // --- History Endpoints ---
        async function logPrediction() {
            if (!accessToken) {
                alert('You must be logged in to log a prediction.');
                return;
            }

            const requestBody = {
                text: document.getElementById('log_text').value,
                human_prediction: document.querySelector('input[name="log_human_pred"]:checked').value === 'true',
                ai_prediction: document.querySelector('input[name="log_ai_pred"]:checked').value === 'true',
                human_explanation: document.getElementById('log_human_exp').value,
                ai_explanation: document.getElementById('log_ai_exp').value,
                probability: parseFloat(document.getElementById('log_prob').value)
            };

            try {
                const response = await fetch(`${API_BASE_URL}/history/`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                const data = await response.json();
                displayResults(data);
            } catch (error) {
                displayResults({ error: error.toString() });
            }
        }

        async function getHistory() {
            if (!accessToken) {
                alert('You must be logged in to get your history.');
                return;
            }
            
            const limit = document.getElementById('get_limit').value;
            const url = limit ? `${API_BASE_URL}/history/?limit=${limit}` : `${API_BASE_URL}/history/`;

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await response.json();
                displayResults(data);
            } catch (error) {
                displayResults({ error: error.toString() });
            }
        }
    </script>
</body>
</html>
