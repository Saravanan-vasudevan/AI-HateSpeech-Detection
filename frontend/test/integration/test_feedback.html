<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Feedback App</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 1em; background-color: #f8f9fa; color: #333; }
        .container { max-width: 800px; margin: auto; display: grid; grid-template-columns: 1fr; gap: 2em; }
        h1, h2 { text-align: center; color: #343a40; }
        textarea { width: 100%; box-sizing: border-box; padding: 12px; font-size: 1.1em; border: 1px solid #ced4da; border-radius: 6px; margin-bottom: 1em; }
        select { width: 100%; padding: 12px; font-size: 1.1em; border-radius: 6px; border: 1px solid #ced4da; margin-bottom: 1em; }
        button { font-size: 1.1em; font-weight: bold; padding: 12px 24px; cursor: pointer; border-radius: 6px; border: none; background-color: #007bff; color: white; display: block; margin: auto; transition: background-color 0.2s; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #6c757d; cursor: not-allowed; }
        .input-section, .results-section { background: #fff; padding: 1.5em 2em; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .result-card { background: #fff; padding: 1.5em; border-radius: 8px; margin-top: 1.5em; border: 1px solid #dee2e6; }
        .result-card h3 { margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 0.5em; }
        .result-card.ai-prediction { border-left: 5px solid #17a2b8; } /* Info Blue */
        .result-card.feedback { border-left: 5px solid #ffc107; } /* Warning Yellow */
        .result-card.extra-feedback { border-left: 5px solid #28a745; } /* Success Green */
        .explanation { background-color: #f8f9fa; border-left: 3px solid #6c757d; padding: 1em; margin-top: 1em; font-size: 0.95em; white-space: pre-wrap; word-wrap: break-word; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; margin: 1em auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="input-section">
            <h1>Interactive Feedback</h1>

            <h2>1. Analyze the Text</h2>
            <textarea id="text-input" placeholder="Enter text to analyze here..." rows="5"></textarea>

            <h2>2. Provide Your Analysis</h2>
            <select id="human-prediction">
                <option value="false">This is NOT hate speech</option>
                <option value="true">This IS hate speech</option>
            </select>
            <textarea id="human-explanation" placeholder="Explain your reasoning here..." rows="3"></textarea>

            <button id="submit-btn" onclick="submitForAnalysis()">Submit for Feedback</button>
        </div>

        <div class="results-section" id="results-container" style="display: none;">
            <h2>Analysis & Feedback</h2>
            <div id="ai-prediction-card" class="result-card ai-prediction"></div>
            <div id="initial-feedback-card" class="result-card feedback"></div>
            <div id="extra-feedback-card" class="result-card extra-feedback" style="display: none;"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000';
        let aiPredictionData = null;

        function showSpinner(container) {
            container.innerHTML = '<div class="spinner"></div>';
        }

        async function submitForAnalysis() {
            const submitBtn = document.getElementById('submit-btn');
            const textInput = document.getElementById('text-input').value;
            const humanPrediction = document.getElementById('human-prediction').value === 'true';
            const humanExplanation = document.getElementById('human-explanation').value;

            if (!textInput.trim() || !humanExplanation.trim()) {
                alert('Please enter text to analyze and your explanation.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            document.getElementById('results-container').style.display = 'block';
            const aiCard = document.getElementById('ai-prediction-card');
            const feedbackCard = document.getElementById('initial-feedback-card');
            showSpinner(aiCard);
            showSpinner(feedbackCard);

            try {
                const geminiResponse = await fetch(`${API_BASE_URL}/gemini/predict`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: textInput })
                });
                if (!geminiResponse.ok) throw new Error('Failed to get AI prediction.');

                aiPredictionData = await geminiResponse.json();

                aiCard.innerHTML = `
                    <h3>AI Analysis (Gemini)</h3>
                    <p><strong>Is Hate Speech:</strong> ${aiPredictionData.is_hate_speech}</p>
                    <div class="explanation"><strong>Explanation:</strong><br>${aiPredictionData.explanation}</div>
                `;

                const feedbackResponse = await fetch(`${API_BASE_URL}/feedback/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        student_prediction: humanPrediction,
                        student_explanation: humanExplanation,
                        ai_prediction: aiPredictionData.is_hate_speech,
                        ai_explanation: aiPredictionData.explanation
                    })
                });
                if (!feedbackResponse.ok) throw new Error('Failed to get initial feedback.');

                const feedbackData = await feedbackResponse.json();

                feedbackCard.innerHTML = `
                    <h3>Personalized Feedback</h3>
                    <div class="explanation">${feedbackData.feedback_text}</div>
                    <button onclick="getExtraFeedback()">Get Extra Feedback</button>
                `;

            } catch (error) {
                aiCard.innerHTML = `<h3>Error</h3><p>${error.message}</p>`;
                feedbackCard.innerHTML = '';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit for Feedback';
            }
        }

        async function getExtraFeedback() {
            const extraFeedbackCard = document.getElementById('extra-feedback-card');
            extraFeedbackCard.style.display = 'block';
            showSpinner(extraFeedbackCard);

            if (!aiPredictionData) {
                extraFeedbackCard.innerHTML = `<h3>Error</h3><p>No AI prediction data available.</p>`;
                return;
            }

            const humanExplanation = document.getElementById('human-explanation').value;
            const extraPrompt = `
                Analyze the following situation and provide a final, detailed summary.
                A user and an AI analyzed a piece of text for hate speech.

                Original Text: "${aiPredictionData.input_text}"

                User's Analysis: "${humanExplanation}"

                AI's Initial Analysis: "${aiPredictionData.explanation}"

                Based on all this information, give a comprehensive explanation that clarifies any misconceptions and provides a definitive analysis of the original text.
            `;

            try {
                const response = await fetch(`${API_BASE_URL}/gemini/predict`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: extraPrompt })
                });
                if (!response.ok) throw new Error('Failed to get extra feedback.');

                const data = await response.json();

                extraFeedbackCard.innerHTML = `
                    <h3>Extra Feedback</h3>
                    <div class="explanation">${data.explanation}</div>
                `;

            } catch (error) {
                extraFeedbackCard.innerHTML = `<h3>Error</h3><p>${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
